name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build

  supabase-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db lint

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Start Supabase
        run: |
          npx supabase start
          npx supabase db reset
      # Audit 2026-08-25 GAP 5: tulis API .dev.vars dari supabase status
      # aktual (lokal) — placeholder dari .env.example tidak berisi
      # SUPABASE_SERVICE_ROLE_KEY, sehingga e2e yang butuh RLS bypass
      # (admin/seed flow) dan auth flow akan gagal dengan pesan keliru
      # (NetworkError / 401). scripts/ci-api-env.sh hanya menulis field
      # yang WAJIB untuk e2e dasar; spec tes yang butuh Midtrans / NFC
      # master key di-skip otomatis ketika env kosong.
      - name: Build apps/api/.dev.vars from supabase status
        run: ./scripts/ci-api-env.sh apps/api/.dev.vars
      - name: Start API & Web
        run: |
          pnpm dev &
          npx wait-on http://localhost:8787/health http://localhost:5173 --timeout 120000
      - name: Run E2E
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
