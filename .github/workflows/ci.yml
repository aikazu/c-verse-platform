name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm --filter @c-verse/api lint:boundaries
      - run: pnpm run test
      - run: pnpm run build

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Start Supabase
        run: |
          npx supabase start
          npx supabase db reset
      # Audit 2026-08-31: lint skema dijalankan di lokal stack yang sama
      # dengan e2e (job supabase-lint lama tidak punya target DB — tanpa
      # `supabase start`/`--db-url`, jadi tidak pernah bisa pass).
      # `db lint` tanpa flag menargetkan database lokal.
      - name: Lint database schema
        run: npx supabase db lint
      # Audit 2026-08-25 GAP 5: tulis API .dev.vars dari supabase status
      # aktual (lokal) — placeholder dari .env.example tidak berisi
      # SUPABASE_SERVICE_ROLE_KEY, sehingga e2e yang butuh RLS bypass
      # (admin/seed flow) dan auth flow akan gagal dengan pesan keliru
      # (NetworkError / 401). scripts/ci-api-env.sh hanya menulis field
      # yang WAJIB untuk e2e dasar. Playwright men-start/reuse API+Web+Admin
      # via webServer blocks; OTP login dibaca dari Mailpit (port 54324).
      - name: Build apps/api/.dev.vars from supabase status
        run: ./scripts/ci-api-env.sh apps/api/.dev.vars
      - name: Run E2E
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
