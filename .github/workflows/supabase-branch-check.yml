# Supabase Branching — GitHub Integration
# When you connect this repo in Dashboard → Integrations → GitHub:
# - `supabase/` at repo root, so Working directory = `.`
# - Every PR creates a preview branch (isolated DB), runs this workflow check
# - Push to `main` auto-deploys migrations + edge functions (if enabled in Dashboard)

name: Supabase Branch Check

on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase-branch-check.yml']
  push:
    branches: [main]
    paths: ['supabase/**']

jobs:
  check:
    runs-on: ubuntu-latest
    # Require Supabase Preview to pass before merge (set in GitHub Branch protection)
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate migrations
        run: |
          supabase db lint 2>&1 | head -n 200 || true
          # `supabase db diff --check` would need a live DB; lint is enough for CI.
          # Real check is `Supabase Preview` status check from the integration.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm run typecheck
      - run: pnpm run build
