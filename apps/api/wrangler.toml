name = "c-verse-api"
main = "src/index.ts"
compatibility_date = "2026-09-02"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# ── Bindings (docs/08 §3.3 — runbook full-edge)
# ENV distinguishes local vs preview vs prod; real secrets via `wrangler secret put` (never in repo).
[vars]
ENV = "production"
SUPABASE_URL = "https://rnsfgbhoahzvrbtvjjtw.supabase.co"

# Secrets (set via `wrangler secret put` — see docs/08 §3.3 + §7):
# SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
# EMAIL_ENABLED (flag email transaksional — akses kreator + queue notifikasi
# uang/pemenuhan via lib/emailQueue.ts; 'true' enable, default OFF di dev),
# EMAIL_FROM (sender address, e.g. no-reply@c-verse.co — domain must be onboarded to Email Service),
# ADMIN_ALERT_EMAIL (recipient of the cron failure digest — lib/cron.ts sends one summary email per run when jobs fail),
# MIDTRANS_SERVER_KEY, NFC_MASTER_KEY, PAYOUT_WEBHOOK_SIGNING_KEY.

# Email sending (owner decision 2026-08-29): Cloudflare Email Service binding —
# replaces the old SMTP/nodemailer transport. Prereq: onboard the sender domain
# (`npx wrangler email sending enable c-verse.co`), else sends fail with
# E_SENDER_NOT_VERIFIED.
[[send_email]]
name = "EMAIL"

# R2 KYC bucket is private and accessed only through the Worker binding.
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "cverse-assets"
[[r2_buckets]]
binding = "KYC"
bucket_name = "cverse-kyc"

[observability]
enabled = true
head_sampling_rate = 1

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 30
period = 60

[[ratelimits]]
name = "NFC_RATE_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "GLOBAL_RATE_LIMITER"
namespace_id = "1003"
[ratelimits.simple]
limit = 600
period = 60

[[ratelimits]]
name = "KYC_RATE_LIMITER"
namespace_id = "1004"
[ratelimits.simple]
limit = 10
period = 60

# Queues (§3.3) — uncomment when created:
# [[queues.producers]]
# binding = "EMAIL_QUEUE"
# queue = "email-queue"
# [[queues.consumers]]
# queue = "email-queue"
# max_batch_size = 10

# Cron Triggers (§3.3):
# - every 1 min: drain queue email transaksional (notifications channel='email'
#   status='pending' -> lib/emailQueue.ts; no-op saat EMAIL_ENABLED off)
# - every 5 min: drop raffle draw pending (draw_pending_drops) + activation
# - Tue 06:00 WIB (Mon 23:00 UTC): payout batch (fee 1%, withholding; disbursement via Midtrans + webhook)
# Badge & housekeeping tanpa cron — badge event-driven (docs/06), bid tanpa expire (accept/cancel/outbid).
[triggers]
crons = ["* * * * *", "*/5 * * * *", "0 23 * * 1"]

# Temporary public origin: workers.dev. Move to `api.c-verse.co` after the
# `c-verse.co` zone is accessible in this Cloudflare account.
